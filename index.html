<!DOCTYPE html>
<!--
  Dhaba Prep Assistant MVP
  Single-page web application for small dhaba and cafe kitchen management.
  Mobile-first (360px+), plain HTML/CSS/JS with Firebase Cloud Firestore.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dhaba Prep Assistant</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-container">
    <!-- Header with dynamic title and back button -->
    <header id="app-header">
      <button id="header-back-btn" class="back-btn hidden" aria-label="Go back to Home">
        &larr; Back
      </button>
      <h1 id="header-title">Today</h1>
      <div style="width: 48px;"><!-- Balance spacer --></div>
    </header>

    <main>
      <!-- Screen A: Today (Home) -->
      <section id="screen-today" class="screen">
        <div class="today-header">
          <div id="today-date-display" class="today-date">Today</div>
        </div>

        <nav class="home-menu" aria-label="Main Navigation">
          <button id="nav-eod" class="big-btn">
            <span>End-of-day log</span>
            <span>&rarr;</span>
          </button>

          <button id="nav-prep" class="big-btn">
            <span>Tomorrow's prep</span>
            <span>&rarr;</span>
          </button>

          <button id="nav-closing" class="big-btn">
            <span>Closing stock count</span>
            <span>&rarr;</span>
          </button>

          <button id="nav-party" class="big-btn">
            <span id="nav-party-label">Party orders</span>
            <span id="nav-party-badge" class="badge">0 upcoming</span>
          </button>
        </nav>
      </section>

      <!-- Screen B: End-of-day log (Task 1, Must-have 1) -->
      <section id="screen-end-of-day" class="screen hidden">
        <div class="eod-date-bar">
          <label for="eod-date">Log Date:</label>
          <input type="date" id="eod-date">
        </div>

        <div id="eod-warning" class="alert-warning hidden" role="alert"></div>
        <div id="eod-error" class="field-error hidden" style="margin-bottom: 12px; font-size: 14px;"></div>

        <div id="eod-items-list">
          <!-- Rendered dynamically by app.js -->
        </div>

        <!-- Add prep item section -->
        <div class="inline-add-box">
          <button id="eod-show-add-btn" class="btn-secondary" style="font-size: 15px;">
            + Add item
          </button>
          <div id="eod-add-form" class="hidden" style="margin-top: 10px;">
            <div class="form-group">
              <label for="new-prep-name">Item Name:</label>
              <input type="text" id="new-prep-name" placeholder="e.g. Kadai Chicken, Chana Masala">
            </div>
            <div class="form-group">
              <label for="new-prep-unit">Unit:</label>
              <input type="text" id="new-prep-unit" placeholder="e.g. kg, L, portions" value="kg">
            </div>
            <div class="inline-add-row">
              <button id="new-prep-save-btn" class="btn-primary" style="flex: 1; min-height: 44px; font-size: 15px;">Add</button>
              <button id="new-prep-cancel-btn" class="btn-secondary" style="flex: 1; min-height: 44px; font-size: 15px;">Cancel</button>
            </div>
          </div>
        </div>

        <button id="eod-save-btn" class="btn-primary">
          Save Log
        </button>
      </section>

      <!-- Screen C: Tomorrow's prep (Placeholder for Task 3) -->
      <section id="screen-prep" class="screen hidden">
        <div class="placeholder-card">
          <h2>Tomorrow's prep</h2>
          <p>Rolling 7-day suggested quantities with plus/minus adjustments.</p>
        </div>
      </section>

      <!-- Screen D: Closing count (Placeholder for Task 4) -->
      <section id="screen-closing" class="screen hidden">
        <div class="placeholder-card">
          <h2>Closing stock count</h2>
          <p>Shift handover count for critical ingredients.</p>
        </div>
      </section>

      <!-- Screen D2: Since last night (Placeholder for Task 4) -->
      <section id="screen-since-last-night" class="screen hidden">
        <div class="placeholder-card">
          <h2>Since last night</h2>
          <p>Discrepancy and morning check verification.</p>
        </div>
      </section>

      <!-- Screen E: Party order (Task 2, Must-have 4) -->
      <section id="screen-party" class="screen hidden">
        <form id="party-order-form" onsubmit="return false;">
          <div class="form-group">
            <label for="party-date">Party Date:</label>
            <input type="date" id="party-date" required>
          </div>

          <div class="form-group">
            <label for="party-headcount">Head Count (People):</label>
            <input type="number" id="party-headcount" min="1" step="1" inputmode="numeric" placeholder="e.g. 25" required>
          </div>

          <div class="form-group">
            <label>Food Items for Prep:</label>
            <div id="party-items-container">
              <!-- Dynamic item rows will be injected here -->
            </div>
            <button type="button" id="party-add-row-btn" class="btn-secondary" style="font-size: 14px; min-height: 40px; margin-top: 6px;">
              + Add row
            </button>
          </div>

          <div class="form-group">
            <label for="party-advance">Advance Paid (Rs.):</label>
            <input type="number" id="party-advance" min="0" step="any" inputmode="decimal" placeholder="0">
          </div>

          <button type="submit" id="party-save-btn" class="btn-primary" style="margin-top: 10px;">
            Save Party Order
          </button>
          <p class="party-hint">Adds to Tomorrow's prep</p>
        </form>

        <!-- Upcoming party orders list -->
        <section class="upcoming-section">
          <h3>Upcoming Party Orders</h3>
          <div id="party-upcoming-list">
            <!-- Dynamic party cards rendered here -->
          </div>
        </section>
      </section>
    </main>

    <!-- Global Toast / Alert message -->
    <div id="toast" class="toast-msg hidden" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
